<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面接適性クイズ - Interview Aptitude Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Bengali&family=Noto+Sans+Devanagari&family=Noto+Sans+Myanmar&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', 'Noto Sans Myanmar', 'Noto Sans Bengali', 'Noto Sans Devanagari', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .screen {
            display: none;
            padding: 50px;
        }

        .screen.active {
            display: block;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .btn-large {
            padding: 25px;
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: #667eea;
            color: white;
            text-align: center;
        }

        .btn-large:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .industry-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .screen-title {
            text-align: center;
            font-size: 2em;
            margin-bottom: 40px;
            color: #333;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 35px;
            margin-bottom: 30px;
        }

        .question-icon {
            font-size: 3.5em;
            text-align: center;
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            color: #333;
            margin-bottom: 35px;
            line-height: 1.7;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .choice-btn {
            padding: 22px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            font-size: 1.15em;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(12px);
        }

        .choice-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .explanation {
            margin-top: 25px;
            padding: 22px;
            background: #fff9e6;
            border-left: 5px solid #ffc107;
            border-radius: 10px;
            display: none;
            line-height: 1.6;
        }

        .explanation.show {
            display: block;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .prev-btn, .next-btn {
            flex: 1;
            padding: 20px;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .prev-btn {
            background: #999;
        }

        .prev-btn:hover {
            background: #777;
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .next-btn.show, .prev-btn.show {
            display: block;
        }

        .progress-bar {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.4s;
        }

        .progress-text {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
            color: #666;
        }

        .result-card {
            text-align: center;
            padding: 50px;
        }

        .result-score {
            font-size: 5em;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }

        .result-judgment {
            font-size: 2.5em;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            border-radius: 15px;
        }

        .result-judgment.pass {
            background: #d4edda;
            color: #155724;
            border: 3px solid #28a745;
        }

        .result-judgment.review {
            background: #fff3cd;
            color: #856404;
            border: 3px solid #ffc107;
        }

        .result-judgment.fail {
            background: #f8d7da;
            color: #721c24;
            border: 3px solid #dc3545;
        }

        .result-message {
            font-size: 1.6em;
            margin: 25px 0;
            line-height: 1.6;
        }

        .restart-btn {
            padding: 20px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #999;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌏 面接適性クイズ</h1>
            <p>Interview Aptitude Quiz - 9 Industries × 8 Languages</p>
        </div>

        <!-- 1. 言語選択画面 -->
        <div id="languageScreen" class="screen active">
            <h2 class="screen-title">言語を選択してください<br>Select Your Language</h2>
            <div class="btn-grid">
                <button class="btn-large" onclick="selectLanguage('ja')">🇯🇵 日本語</button>
                <button class="btn-large" onclick="selectLanguage('en')">🇬🇧 English</button>
                <button class="btn-large" onclick="selectLanguage('my')">🇲🇲 မြန်မာ</button>
                <button class="btn-large" onclick="selectLanguage('vi')">🇻🇳 Tiếng Việt</button>
                <button class="btn-large" onclick="selectLanguage('mn')">🇲🇳 Монгол</button>
                <button class="btn-large" onclick="selectLanguage('bn')">🇧🇩 বাংলা</button>
                <button class="btn-large" onclick="selectLanguage('si')">🇱🇰 සිංහල</button>
                <button class="btn-large" onclick="selectLanguage('ne')">🇳🇵 नेपाली</button>
            </div>
        </div>

        <!-- 2. 業種選択画面 -->
        <div id="industryScreen" class="screen">
            <h2 class="screen-title" id="industryTitle">業種を選択してください</h2>
            <div class="btn-grid">
                <button class="btn-large industry-btn" onclick="selectIndustry('restaurant')">🍽️ 飲食業</button>
                <button class="btn-large industry-btn" onclick="selectIndustry('manufacturing')">🏭 製造業</button>
                <button class="btn-large industry-btn" onclick="selectIndustry('construction')">🏗️ 建設業</button>
                <button class="btn-large industry-btn" onclick="selectIndustry('accommodation')">🏨 宿泊業</button>
                <button class="btn-large industry-btn" onclick="selectIndustry('logistics')">🚚 物流業</button>
                <button class="btn-large industry-btn" onclick="selectIndustry('office')">💼 一般事務</button>
                <button class="btn-large industry-btn" onclick="selectIndustry('cleaning')">🧹 清掃業</button>
                <button class="btn-large industry-btn" onclick="selectIndustry('automotive')">🔧 自動車整備業</button>
                <button class="btn-large industry-btn" onclick="selectIndustry('retail')">🛒 小売業</button>
            </div>
            <button class="back-btn" onclick="showScreen('languageScreen')">← 戻る</button>
        </div>

        <!-- 3. クイズ画面 -->
        <div id="quizScreen" class="screen">
            <div class="progress-text" id="progressText"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="questionContainer"></div>
            <button class="back-btn" onclick="backToIndustry()">← 業種選択に戻る</button>
        </div>

        <!-- 4. 結果画面 -->
        <div id="resultScreen" class="screen">
            <div class="result-card">
                <h2 id="resultTitle">クイズ完了！</h2>
                <div class="result-score" id="resultScore"></div>
                <div class="result-judgment" id="resultJudgment"></div>
                <div class="result-message" id="resultMessage"></div>
                <button class="restart-btn" onclick="restart()">最初から / Restart</button>
            </div>
        </div>
    </div>

    
    <script>
        // ===== ALL QUESTION DATA (INLINED) =====
        const ALL_COMMON = {
  "ja": [
  {
    id: 1,
    question: "日本で働くことに興味がありますか？",
    image: "/interview-quiz-images/q1.jpg",
    choices: [
      {
        text: "はい、とても興味があります",
        score: 1.0,
        emoji: "⭕",
        explanation: `日本で働くことに強い興味を持っていることは、最も重要な要素です。興味があるからこそ、日本語や文化を学ぶ意欲が生まれ、困難な状況でも乗り越える力になります。日本の企業は、スキルや経験だけでなく、「この国で働きたい」という熱意を非常に重視します。

興味を持つ理由は人それぞれです。日本の技術を学びたい、安定した生活を送りたい、家族を支えたい、キャリアアップしたい、など。どんな理由であれ、その熱意が仕事への真剣さにつながります。面接では、具体的な理由を説明できると、さらに評価が高まります。

また、日本で働くことへの興味は、長期的な定着率にも影響します。興味がある人は、困難があっても「日本で頑張りたい」と思い続けられます。一方、興味が薄い人は、少しの困難ですぐに帰国を考えてしまいます。企業は長く働いてくれる人材を求めているため、この質問への答えは採用の大きな分かれ道です。

この回答をした人は、面接で最も好印象を与え、採用される可能性が非常に高くなります。日本での仕事を真剣に考えている証拠として、高く評価されます。`
      },
      {
        text: "まあまあ興味があります",
        score: 0.7,
        emoji: "🟡",
        explanation: `「まあまあ」という表現は、日本語では「それほど強くない」という意味に受け取られることがあります。本当は興味があっても、謙虚に答えただけかもしれませんが、面接官は「この人の意欲は本物だろうか？」と少し不安を感じます。

もしこの回答をする場合は、面接で必ず補足説明をしましょう。「日本の〇〇に興味があります」「日本で△△を学びたいです」など、具体的な興味の内容を伝えることで、評価を上げることができます。

日本の企業文化では、控えめな表現よりも、はっきりとした意思表示が好まれます。特に面接という場面では、自分の気持ちを明確に伝えることが大切です。「とても興味があります」と自信を持って答える方が、印象は良くなります。

ただし、この回答でも不採用になるわけではありません。他の質問で熱意を示せば、総合的に評価されます。大切なのは、日本で働く意欲を何らかの形で伝えることです。`
      },
      {
        text: "少し興味があります",
        score: 0.5,
        emoji: "🟡",
        explanation: `「少し」という言葉は、興味の度合いが低いことを示しています。面接官は「この人は本当に日本で働きたいのだろうか？」「他に良い選択肢があれば、すぐに辞めてしまうのでは？」と心配します。

この回答をする理由は様々です。日本についてまだよく知らない、他の国も検討している、家族が反対している、など。しかし、面接では「少し」という消極的な表現は避けるべきです。もし本当に迷っているなら、まず自分の気持ちを整理してから応募する方が良いでしょう。

ただし、正直に「少し」と答えることで、面接官が詳しく説明してくれることもあります。「どんなところに不安がありますか？」「日本での生活について知りたいことはありますか？」など、対話を通じて興味が深まることもあります。

もしこの回答をしてしまった場合は、面接の中で必ず挽回のチャンスを作りましょう。「最初は少し不安でしたが、御社の話を聞いて、ぜひ働きたいと思いました」などと伝えれば、評価を上げることができます。`
      },
      {
        text: "あまり興味がありません",
        score: 0,
        emoji: "❌",
        explanation: `この回答は、面接では致命的です。日本で働くことに興味がない人が、なぜ面接に来たのか、面接官は理解できません。「家族に言われて仕方なく」「他に選択肢がないから」という理由だとしても、それを正直に言ってしまうと、採用される可能性はほぼゼロです。

企業は、意欲のない人を雇うリスクを避けます。興味がない人は、仕事を覚えるのが遅い、すぐに辞める、トラブルを起こしやすい、というデータがあります。特に外国人雇用では、ビザの手続きや生活サポートなど、企業側の負担が大きいため、確実に長く働いてくれる人だけを採用したいのです。

もし本当に日本に興味がないなら、無理に応募する必要はありません。他の国、他の仕事を探す方が、自分にとっても幸せです。一方、もし「興味はあるけれど不安が大きい」という場合は、面接で正直に相談しましょう。良い企業なら、不安を解消する情報を提供してくれます。

この回答は、どんなに他の能力が高くても、挽回が非常に難しいです。面接では、必ず前向きな回答を選びましょう。`
      }
    ]
  },
  {
    id: 2,
    question: "日本語を勉強していますか？",
    image: "/interview-quiz-images/q2.jpg",
    choices: [
      {
        text: "はい、毎日勉強しています",
        score: 1.0,
        emoji: "⭕",
        explanation: `毎日日本語を勉強している姿勢は、非常に高く評価されます。これは単に言語能力だけでなく、「努力できる人」「目標に向かって継続できる人」という証明にもなります。日本の企業が最も重視するのは、こうした真面目な姿勢です。

日本語の勉強方法は様々です。学校に通う、オンライン授業を受ける、アプリで学ぶ、日本人と話す練習をする、日本のドラマを見る、など。面接では、具体的な勉強方法を説明できると、さらに印象が良くなります。「毎日30分、アプリで勉強しています」「週に2回、日本語教室に通っています」など。

また、現在の日本語レベルも正直に伝えましょう。「ひらがなとカタカナは読めます」「簡単な会話ができます」「JLPTのN4を持っています」など。完璧でなくても、学び続けている姿勢が大切です。

この回答をした人は、入社後も新しいことを学び続ける人材として期待されます。日本語だけでなく、仕事のスキルも積極的に学んでくれると信じてもらえます。`
      },
      {
        text: "少し勉強しています",

        explanation: `「少し勉強している」という回答は、悪くありませんが、「毎日」と比べると熱意が伝わりにくいです。面接官は「この人はどれくらい真剣なのだろう？」と疑問を持つかもしれません。

もしこの回答をする場合は、「少し」の意味を具体的に説明しましょう。「週に2回、1時間ずつ勉強しています」「仕事が忙しいですが、週末に勉強しています」など、具体的な時間や頻度を伝えれば、面接官も安心します。

また、今後の勉強計画を話すことも効果的です。「今は少しですが、合格したらもっと本格的に勉強します」「入社前に集中的に勉強する予定です」など、前向きな姿勢を示せば、評価を上げることができます。

日本語の勉強は、入社後も続けることが大切です。仕事をしながら学ぶのは大変ですが、日本語が上達するほど、仕事の幅も広がり、給料も上がります。「少し」から「毎日」へと、少しずつ勉強時間を増やしていきましょう。`
      },
      {
        text: "これから勉強します",
        score: 0.5,
        emoji: "🟡",
        explanation: `「これから勉強する」という回答は、正直ですが、準備不足の印象を与えます。面接官は「この人は本当に日本で働く準備ができているのか？」と心配します。特に、面接の時点でまだ勉強を始めていないことは、計画性の欠如と受け取られることもあります。

また、「勉強していない理由」も正直に伝えることが大切です。「日本で働くことを決めたのが最近です」「仕事が忙しくて時間がありませんでした」など。その上で、「これから本気で勉強します」という決意を示せば、面接官も理解してくれるかもしれません。

理想的には、面接を受ける前に、少しでも日本語の勉強を始めておくことをお勧めします。1週間でも、2週間でも、勉強した実績があれば、「勉強しています」と答えられます。`
      },
      {
        text: "勉強していません",
        score: 0.3,
        emoji: "🟢",
        explanation: `「勉強していません」と正直に答えることは、勇気がいることです。しかし、面接では大きなマイナスポイントになります。日本で働くために日本語は必須であり、勉強していないことは「準備不足」「やる気がない」と受け取られます。

もしこの回答をしてしまった場合は、必ず理由と今後の計画を説明しましょう。「母国では日本語を学ぶ機会がありませんでした」「経済的な理由で学校に通えませんでした」など、正当な理由があれば、面接官も理解してくれます。

そして、「入社後にどう勉強するか」を具体的に話しましょう。「会社の日本語研修に真剣に参加します」「毎日2時間、自分で勉強します」「3ヶ月でJLPTのN5を取ります」など、明確な目標を示せば、やる気を伝えることができます。

日本語ゼロでも採用される仕事はあります。特に、工場の単純作業や、外国人が多い職場では、日本語不要の求人もあります。ただし、日本語ができる人と比べて、選択肢は狭まり、給料も低くなることを理解しておく必要があります。`
      }

  },
  {
    id: 3,
    question: "日本の文化やルールを守ることができますか？",
    image: "/interview-quiz-images/q3.jpg",
    choices: [
      {

        emoji: "⭕",
        explanation: `日本の文化やルールを尊重する姿勢は、外国人採用で最も重要な要素の一つです。どんなに能力が高くても、文化を尊重しない人は、職場でトラブルを起こし、周囲との関係が悪化します。逆に、文化を尊重する人は、言葉が少し不自由でも、周りから助けてもらえます。

面接では、具体的にどんなルールを知っているかを話せると良いでしょう。「時間を守ることが大切だと聞きました」「挨拶を大切にします」「ゴミの分別を守ります」など。事前に日本の文化について調べていることを示せば、準備の良さも評価されます。

この回答をした人は、職場に早く馴染み、日本人の同僚とも良好な関係を築ける人材として、高く評価されます。文化を尊重する姿勢は、長く日本で働くための土台です。`
      },
      {
        text: "はい、努力します",
        score: 0.7,

        // ===== QUIZ APPLICATION =====
        // グローバル変数
        let currentLanguage = 'ja';
        let currentIndustry = '';
        let currentQuestionIndex = 0;
        let totalScore = 0;
        let maxScore = 0;
        let allQuestions = [];
        let commonQuestions = [];
        let industryQuestions = [];
        let userAnswers = []; // 回答履歴を保存

        // 多言語テキスト
        const translations = {
            ja: {
                industryTitle: '業種を選択してください',
                resultTitle: 'クイズ完了！',
                progressText: '質問 {current} / {total}',
                nextBtn: '次へ →',
                msg80: '素晴らしい！この業種に非常に適しています！',
                msg60: '良い結果です！この業種での活躍が期待できます。',
                msg40: 'まずまずです。さらに準備を進めましょう。',
                msg0: '他の業種も検討してみましょう。'
            },
            en: {
                industryTitle: 'Select Industry',
                resultTitle: 'Quiz Complete!',
                progressText: 'Question {current} / {total}',
                nextBtn: 'Next →',
                msg80: 'Excellent! You are very suitable for this industry!',
                msg60: 'Good result! You can thrive in this industry.',
                msg40: 'Not bad. Keep preparing.',
                msg0: 'Consider other industries as well.'
            }
        };

        function getText(key) {
            const lang = translations[currentLanguage] || translations['ja'];
            return lang[key] || translations['ja'][key];
        }

        function selectLanguage(lang) {
            currentLanguage = lang;
            showScreen('industryScreen');
            document.getElementById('industryTitle').textContent = getText('industryTitle');
        }

        async function selectIndustry(industry) {
            currentIndustry = industry;
            currentQuestionIndex = 0;
            totalScore = 0;
            maxScore = 0;
            userAnswers = []; // 回答履歴をリセット
            
            await loadQuestions();
        }

        async function loadQuestions() {
            try {
                // 共通質問を取得
                commonQuestions = JSON.parse(JSON.stringify(ALL_COMMON[currentLanguage] || []));
                
                // 業種別質問を取得
                const langData = ALL_INDUSTRY[currentLanguage] || {};
                industryQuestions = JSON.parse(JSON.stringify(langData[currentIndustry] || []));
                
                // 質問を結合（共通4問 + 業種別11問）
                allQuestions = [...commonQuestions, ...industryQuestions];
                
                showScreen('quizScreen');
                showQuestion();
            } catch (error) {
                console.error('Error loading questions:', error);
                alert('質問の読み込みに失敗しました');
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showQuestion() {
            if (currentQuestionIndex >= allQuestions.length) {
                showResult();
                return;
            }

            const question = allQuestions[currentQuestionIndex];
            maxScore += 1.0;

            const progress = ((currentQuestionIndex + 1) / allQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            const progressText = getText('progressText')
                .replace('{current}', currentQuestionIndex + 1)
                .replace('{total}', allQuestions.length);
            document.getElementById('progressText').textContent = progressText;
            
            // 前の問題に戻れるようにprevBtnの表示を制御

            const container = document.getElementById('questionContainer');
            
            // 前回の回答があれば選択状態を復元
            const previousAnswer = userAnswers[currentQuestionIndex];
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-icon">${question.icon || '📝'}</div>
                    <div class="question-text">Q${currentQuestionIndex + 1}. ${question.question}</div>
                    <div class="choices">
                        ${question.choices.map((choice, idx) => `
                            <button class="choice-btn ${previousAnswer === idx ? 'selected' : ''}" onclick="selectChoice(${idx})" ${previousAnswer !== undefined ? 'disabled' : ''}>
                                ${choice.emoji} ${choice.text}
                            </button>
                        `).join('')}
                    </div>
                    <div class="explanation ${previousAnswer !== undefined ? 'show' : ''}" id="explanation">${previousAnswer !== undefined ? question.choices[previousAnswer].explanation : ''}</div>
                    <div class="nav-buttons" style="display: flex;">
                        <button class="prev-btn" id="prevBtn" onclick="prevQuestion()" style="${currentQuestionIndex === 0 ? 'visibility: hidden;' : 'display: block;'}">← 前へ / Previous</button>
                        <button class="next-btn ${previousAnswer !== undefined ? 'show' : ''}" id="nextBtn" onclick="nextQuestion()">${getText('nextBtn')}</button>
                    </div>
                </div>
            `;
        }

        function selectChoice(choiceIndex) {
            const question = allQuestions[currentQuestionIndex];
            const choice = question.choices[choiceIndex];

            // 前回の回答があればスコアを引く（戻って再回答の場合）
            if (userAnswers[currentQuestionIndex] !== undefined) {
                const prevChoice = question.choices[userAnswers[currentQuestionIndex]];
                totalScore -= prevChoice.score;
            }

            // 新しい回答を保存
            userAnswers[currentQuestionIndex] = choiceIndex;
            totalScore += choice.score;

            document.querySelectorAll('.choice-btn').forEach((btn, idx) => {
                btn.classList.remove('selected');
                btn.disabled = true;
                if (idx === choiceIndex) {
                    btn.classList.add('selected');
                }
            });

            document.getElementById('explanation').innerHTML = question.explanation;
            const explanationEl = document.getElementById('explanation');
            const nextBtnEl = document.getElementById('nextBtn');
            if (explanationEl) explanationEl.classList.add('show');
            if (nextBtnEl) nextBtnEl.classList.add('show');
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        function showResult() {
            const percentage = Math.round((totalScore / maxScore) * 100);
            
            document.getElementById('resultTitle').textContent = getText('resultTitle');
            document.getElementById('resultScore').textContent = percentage + '点';
            
            // 合格判定
            let judgment = '';
            let judgmentClass = '';
            if (percentage >= 70) {
                judgment = currentLanguage === 'ja' ? '✅ 合格' : '✅ Pass';
                judgmentClass = 'pass';
            } else if (percentage >= 50) {
                judgment = currentLanguage === 'ja' ? '⚠️ 要検討' : '⚠️ Review Required';
                judgmentClass = 'review';
            } else {
                judgment = currentLanguage === 'ja' ? '❌ 不合格' : '❌ Fail';
                judgmentClass = 'fail';
            }
            
            const judgmentEl = document.getElementById('resultJudgment');
            judgmentEl.textContent = judgment;
            judgmentEl.className = 'result-judgment ' + judgmentClass;
            
            let message = '';
            if (percentage >= 80) {
                message = getText('msg80');
            } else if (percentage >= 60) {
                message = getText('msg60');
            } else if (percentage >= 40) {
                message = getText('msg40');
            } else {
                message = getText('msg0');
            }
            
            document.getElementById('resultMessage').textContent = message;
            showScreen('resultScreen');
        }

        function backToIndustry() {
            allQuestions = [];
            commonQuestions = [];
            industryQuestions = [];
            showScreen('industryScreen');
        }

        function restart() {
            allQuestions = [];
            commonQuestions = [];
            industryQuestions = [];
            userAnswers = []; // 回答履歴をリセット
            currentQuestionIndex = 0;
            totalScore = 0;
            maxScore = 0;
            showScreen('languageScreen');
        }
    </script>
